:root {
  color-scheme: light;

  color: #18212f;
  background: #eef2f4;

  -webkit-font-smoothing: antialiased;
}

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-width: 320px;
  min-height: 100vh;
  background: #eef2f4;
}

@media (min-width: 861px) {
  body {
    overflow: hidden;
  }
}

button,
input,
select {
  font: inherit;
}

button {
  border: 0;
  cursor: pointer;
}

.shell {
  display: grid;
  grid-template-columns: minmax(320px, 390px) minmax(0, 1fr);
  min-height: 100vh;
}

@media (min-width: 861px) {
  .shell {
    height: 100vh;
    overflow: hidden;
  }
}

.panel {
  display: flex;
  flex-direction: column;
  gap: 22px;
  min-height: 100vh;
  padding: 22px;
  overflow-y: auto;
  background: #fbfbf8;
  border-right: 1px solid #d9dedc;
}

@media (min-width: 861px) {
  .panel {
    height: 100vh;
  }
}

.brand {
  display: flex;
  align-items: center;
  gap: 12px;
}

.mark {
  width: 38px;
  height: 38px;
  flex: 0 0 auto;
  border-radius: 8px;
  background:
    linear-gradient(135deg, transparent 40%, rgba(255, 255, 255, 0.4) 41%),
    linear-gradient(140deg, #4f8c7b, #d96f4a);
  box-shadow: inset 0 0 0 1px rgba(24, 33, 47, 0.14);
}

h1,
h2,
p {
  margin: 0;
}

h1 {
  font-size: 20px;
  line-height: 1.2;
  letter-spacing: 0;
}

.brand p {
  margin-top: 4px;
  color: #65717d;
  font-size: 13px;
}

.controls {
  display: grid;
  gap: 14px;
}

.inlineGrid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
}

label {
  display: grid;
  gap: 7px;
  color: #44515e;
  font-size: 13px;
}

input,
select {
  width: 100%;
  height: 42px;
  border: 1px solid #cbd3d1;
  border-radius: 8px;
  padding: 0 12px;
  color: #17202c;
  background: #ffffff;
  outline: none;
}

input:focus,
select:focus {
  border-color: #4f8c7b;
  box-shadow: 0 0 0 3px rgba(79, 140, 123, 0.16);
}

input[type="range"] {
  height: 24px;
  padding: 0;
  accent-color: #4f8c7b;
}

output {
  justify-self: end;
  color: #65717d;
  font-size: 12px;
}

.segmented {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 6px;
  padding: 4px;
  border: 1px solid #cbd3d1;
  border-radius: 8px;
  background: #ffffff;
}

.segmented label {
  display: flex;
  align-items: center;
  justify-content: center;
  min-height: 34px;
  border-radius: 6px;
  color: #44515e;
}

.segmented input {
  position: absolute;
  width: 1px;
  height: 1px;
  opacity: 0;
}

.segmented label:has(input:checked) {
  color: #ffffff;
  background: #356e62;
}

.siteEditor {
  display: grid;
  gap: 9px;
}

.siteEditor[hidden] {
  display: none;
}

.siteEditor svg {
  width: 100%;
  height: auto;
  min-height: 170px;
  border-radius: 8px;
  background: #eef2f4;
  cursor: crosshair;
  touch-action: manipulation;
}

.siteEditor rect {
  fill: #f7faf8;
  stroke: #cbd3d1;
}

.siteEditor .sketchLine {
  fill: rgba(79, 140, 123, 0.16);
  stroke: #356e62;
  stroke-width: 2;
}

.siteEditor circle {
  fill: #d96f4a;
  stroke: #ffffff;
  stroke-width: 2;
  cursor: grab;
}

.siteEditor circle.selected {
  fill: #356e62;
  stroke: #f1b36d;
  stroke-width: 3;
}

.siteEditor text {
  fill: #44515e;
  font-size: 11px;
  user-select: none;
}

.siteEditor p {
  color: #65717d;
  font-size: 12px;
  line-height: 1.5;
}

.buttonRow {
  display: grid;
  grid-template-columns: 1fr 112px;
  gap: 10px;
}

.buttonRow button,
#exportButton,
#loadMoreButton {

  color: #22303b;
  background: #e7ece8;

}

.buttonRow .primary {

}

.buttonRow button:hover,
#exportButton:hover,

.metrics {

}

.metrics article {

  border-radius: 8px;

.metrics span {

.metrics strong {

.options {

.sectionTitle {

.legend .build {

function createRandom(seed) {
  let value = seed % 2147483647;
  if (value <= 0) value += 2147483646;
  return () => {
    value = (value * 16807) % 2147483647;
    return (value - 1) / 2147483646;
  };
}

function clamp(value, min, max) {
  return Math.min(Math.max(value, min), max);
}

function randomBetween(rng, min, max) {
  return min + (max - min) * rng();
}

function randomInt(rng, min, max) {
  return Math.floor(randomBetween(rng, min, max + 1));
}

function pick(rng, items) {
  return items[Math.floor(rng() * items.length) % items.length];
}

function formatNumber(value) {
  return new Intl.NumberFormat("zh-CN", { maximumFractionDigits: 1 }).format(value);
}

function polygonArea(points) {
  if (points.length < 3) return 0;
  return Math.abs(
    points.reduce((sum, point, index) => {
      const next = points[(index + 1) % points.length];
      return sum + point.x * next.y - next.x * point.y;
    }, 0) / 2,
  );
}

function pointBounds(points) {
  const xs = points.map((point) => point.x);
  const ys = points.map((point) => point.y);
  return {
    minX: Math.min(...xs),
    maxX: Math.max(...xs),
    minY: Math.min(...ys),
    maxY: Math.max(...ys),
  };
}

function createSite(input) {
  if (input.siteMode === "free" && input.sitePoints.length >= 3 && polygonArea(input.sitePoints) > 10) {
    const bounds = pointBounds(input.sitePoints);
    const centerX = (bounds.minX + bounds.maxX) / 2;
    const centerY = (bounds.minY + bounds.maxY) / 2;
    const scale = Math.sqrt(input.siteArea / polygonArea(input.sitePoints));
    const points = input.sitePoints.map((point) => ({
      x: (point.x - centerX) * scale,
      z: (point.y - centerY) * scale,
    }));
    return {
      mode: "free",
      points,
      width: (bounds.maxX - bounds.minX) * scale,
      length: (bounds.maxY - bounds.minY) * scale,
    };
  }

  const width = Math.sqrt(input.siteArea / input.siteRatio);
  const length = width * input.siteRatio;
  return {
    mode: "rectangle",
    width,
    length,
    points: [
      { x: -width / 2, z: -length / 2 },
      { x: width / 2, z: -length / 2 },
      { x: width / 2, z: length / 2 },
      { x: -width / 2, z: length / 2 },
    ],
  };
}

function getFloorRange(input, rules, far) {
  if (input.manualFloors > 0) return [input.manualFloors, input.manualFloors];
  if (input.manualHeight > 0) {
    const floors = Math.max(1, Math.round(input.manualHeight / rules.floorHeight));
    return [floors, floors];
  }
  if (input.floorMode === "low") return [1, Math.min(6, rules.preferredFloors[1])];
  if (input.floorMode === "mid") return [6, Math.min(16, Math.max(8, rules.preferredFloors[1]))];
  if (input.floorMode === "high") return [16, Math.max(24, rules.preferredFloors[1])];
  const target = Math.sqrt(far) * 7 + rules.preferredFloors[0];
  return [
    clamp(Math.round(target * 0.7), rules.preferredFloors[0], rules.preferredFloors[1]),
    clamp(Math.round(target * 1.25), rules.preferredFloors[0], rules.preferredFloors[1]),
  ];
}

function chooseRoof(input, form, index) {
  if (input.roofType !== "auto") return input.roofType;
  const options = form === "tower" || form === "podiumTower"
    ? ["flat", "terrace", "green"]
    : ["flat", "pitched", "terrace", "green", "sawtooth"];
  return options[index % options.length];
}

function generateSchemes(input, count = INITIAL_SCHEME_COUNT, startIndex = 0) {
  const rules = BUILDING_RULES[input.type];
  const site = createSite(input);
  const far = input.buildingArea / input.siteArea;
  const [minFloors, maxFloors] = getFloorRange(input, rules, far);
  const rng = createRandom(input.seed + startIndex * 7919);

  const stylePool = [
    ...rules.forms,
    "freeMix",
    "multiInterlock",
    "porousMat",
    "cantileverChain",
    "pinwheel",
    "terraceVillage",
  ];

  return Array.from({ length: count }, (_, localIndex) => {
    const index = startIndex + localIndex;
    const form = stylePool[(index + Math.floor(rng() * stylePool.length)) % stylePool.length];
    const floorBias = (index % count) / Math.max(1, count - 1);
    const proposedFloors = clamp(
      Math.round(minFloors + (maxFloors - minFloors) * (0.18 + floorBias * 0.68 + rng() * 0.18)),
      minFloors,
      maxFloors,
    );
    const coverageTarget = clamp(input.buildingArea / proposedFloors / input.siteArea, rules.coverage[0], rules.coverage[1]);
    const autoFloors = Math.max(1, Math.round(input.buildingArea / (coverageTarget * input.siteArea)));
    const floors = input.manualFloors > 0 || input.manualHeight > 0 || input.floorMode !== "auto" ? proposedFloors : autoFloors;
    const floorHeight = input.manualHeight > 0 ? input.manualHeight / floors : rules.floorHeight;
    const height = input.manualHeight > 0 ? input.manualHeight : floors * floorHeight;
    const footprint = input.buildingArea / floors;

    return createMassing({
      id: index,
      name: `方案 ${String(index + 1).padStart(3, "0")}`,
      rules,
      type: input.type,
      form,
      mixComplexity: 3 + (index % 4),
      roofType: chooseRoof(input, form, index),
      buildingArea: input.buildingArea,
      siteArea: input.siteArea,
      site,
      siteWidth: site.width,
      siteLength: site.length,
      floors,
      floorHeight,
      footprint,
      coverage: footprint / input.siteArea,
      far,
      height,
      rng: createRandom(input.seed + index * 1009 + localIndex * 101),
    });
  });
}

function createMassing(base) {
  const margin = Math.max(8, Math.min(base.siteWidth, base.siteLength) * 0.08);
  const buildableW = Math.max(12, base.siteWidth - margin * 2);
  const buildableL = Math.max(12, base.siteLength - margin * 2);
  const massing = {
    ...base,
    blocks: [],
    openSpaces: [],
    notes: [],
    detailTags: [],
  };

  const creators = {
    tower: createTower,
    bar: createBars,
    slab: createBars,
    podium: createPodium,
    atrium: createAtrium,
    courtyard: createCourtyard,
    cluster: createCluster,
    podiumTower: createPodiumTower,
    interlock: createInterlock,
    cantilever: createCantilever,
    stepped: createStepped,
    bridge: createBridge,
    freeMix: createFreeMix,
    multiInterlock: createMultiInterlock,
    porousMat: createPorousMat,
    cantileverChain: createCantileverChain,
    pinwheel: createPinwheel,
    terraceVillage: createTerraceVillage,
  };
  creators[base.form]?.(massing, buildableW, buildableL);
  addSecondaryFragments(massing, buildableW, buildableL);
  resolveBlockCollisions(massing, buildableW, buildableL);
  addDetailPass(massing);
  return massing;
}

function addSecondaryFragments(massing, buildableW, buildableL) {
  const richForms = ["freeMix", "multiInterlock", "porousMat", "cantileverChain", "terraceVillage", "pinwheel"];
  const minimum = richForms.includes(massing.form)
    ? randomInt(massing.rng, 6, 10)
    : randomInt(massing.rng, 4, 7);
  while (massing.blocks.length < minimum) {
    const floors = randomInt(massing.rng, 1, Math.max(2, Math.min(5, massing.floors)));
    const w = clamp(randomBetween(massing.rng, massing.rules.minDepth, massing.rules.minDepth * 2.2), 8, buildableW * 0.28);
    const l = clamp(randomBetween(massing.rng, massing.rules.minDepth * 0.8, massing.rules.maxDepth * 1.15), 8, buildableL * 0.28);
    addBlock(massing, {
      x: randomBetween(massing.rng, -buildableW * 0.32, buildableW * 0.32),
      z: randomBetween(massing.rng, -buildableL * 0.32, buildableL * 0.32),
      w,
      l,
      floors,
      yBase: massing.rng() > 0.72 ? randomInt(massing.rng, 1, Math.max(1, Math.floor(massing.floors * 0.45))) * massing.floorHeight : 0,
      label: pick(massing.rng, ["嵌入盒子", "入口体块", "屋顶盒子", "侧向插块"]),
      roof: pick(massing.rng, ["flat", "terrace", massing.roofType]),
      isSetback: massing.rng() > 0.55,
    });
  }
}

function blockRange(block) {
  return {
    minX: block.x - block.w / 2,
    maxX: block.x + block.w / 2,
    minZ: block.z - block.l / 2,
    maxZ: block.z + block.l / 2,
    minY: block.yBase,
    maxY: block.yBase + block.h,
  };
}

function rangesOverlap(aMin, aMax, bMin, bMax, gap = 0) {
  return Math.min(aMax, bMax) - Math.max(aMin, bMin) > gap;
}

function blocksClash(a, b) {
  const ar = blockRange(a);
  const br = blockRange(b);
  return (
    rangesOverlap(ar.minX, ar.maxX, br.minX, br.maxX, 0.8) &&
    rangesOverlap(ar.minZ, ar.maxZ, br.minZ, br.maxZ, 0.8) &&
    rangesOverlap(ar.minY, ar.maxY, br.minY, br.maxY, 0.8)
  );
}

function clampBlock(block, buildableW, buildableL) {
  block.x = clamp(block.x, -buildableW / 2 + block.w / 2, buildableW / 2 - block.w / 2);
  block.z = clamp(block.z, -buildableL / 2 + block.l / 2, buildableL / 2 - block.l / 2);
}

function resolveBlockCollisions(massing, buildableW, buildableL) {
  massing.blocks.forEach((block) => clampBlock(block, buildableW, buildableL));
  for (let pass = 0; pass < 9; pass += 1) {
    let moved = false;
    for (let i = 0; i < massing.blocks.length; i += 1) {
      for (let j = i + 1; j < massing.blocks.length; j += 1) {
        const a = massing.blocks[i];
        const b = massing.blocks[j];
        if (!blocksClash(a, b)) continue;
        const ar = blockRange(a);
        const br = blockRange(b);
        const overlapX = Math.min(ar.maxX, br.maxX) - Math.max(ar.minX, br.minX);
        const overlapZ = Math.min(ar.maxZ, br.maxZ) - Math.max(ar.minZ, br.minZ);
        if (overlapX < overlapZ) {
          const direction = b.x >= a.x ? 1 : -1;
          b.x += direction * (overlapX + 2.2);
        } else {
          const direction = b.z >= a.z ? 1 : -1;
          b.z += direction * (overlapZ + 2.2);
        }
        clampBlock(b, buildableW, buildableL);
        moved = true;
      }
    }
    if (!moved) break;
  }

  massing.blocks.forEach((block, index) => {
    for (let attempts = 0; attempts < 12; attempts += 1) {
      const hasClash = massing.blocks.some((other, otherIndex) => otherIndex < index && blocksClash(block, other));
      if (!hasClash) break;
      block.x = randomBetween(massing.rng, -buildableW * 0.38, buildableW * 0.38);
      block.z = randomBetween(massing.rng, -buildableL * 0.38, buildableL * 0.38);
      clampBlock(block, buildableW, buildableL);
    }
  });
  separateRemainingClashesVertically(massing);
  massing.height = Math.max(massing.height, ...massing.blocks.map((block) => block.yBase + block.h));
}

function separateRemainingClashesVertically(massing) {
  for (let pass = 0; pass < 12; pass += 1) {
    let adjusted = false;
    for (let i = 0; i < massing.blocks.length; i += 1) {
      for (let j = i + 1; j < massing.blocks.length; j += 1) {
        const lower = massing.blocks[i].yBase <= massing.blocks[j].yBase ? massing.blocks[i] : massing.blocks[j];
        const upper = lower === massing.blocks[i] ? massing.blocks[j] : massing.blocks[i];
        if (!blocksClash(lower, upper)) continue;
        upper.yBase = lower.yBase + lower.h + 0.35;
        upper.floorStart = Math.max(upper.floorStart || 0, Math.round(upper.yBase / massing.floorHeight));
        upper.isSetback = true;
        adjusted = true;
      }
    }
    if (!adjusted) break;
  }
}

function addBlock(massing, block) {
  const floors = Math.max(1, Math.round(block.floors ?? block.h / massing.floorHeight));
  const h = block.h ?? floors * massing.floorHeight;
  massing.blocks.push({
    color: massing.rules.palette[massing.blocks.length % massing.rules.palette.length],
    yBase: 0,
    floorStart: 0,
    roof: massing.roofType,
    isSetback: false,
    ...block,
    h,
    floors,
  });
}

function addDetailPass(massing) {
  const hasSetback = massing.blocks.some((block) => block.isSetback || block.floorStart > 0);
  if (hasSetback) massing.detailTags.push("退台");
  if (massing.blocks.some((block) => block.yBase > 0)) massing.detailTags.push("悬挑/连桥");
  massing.detailTags.push(ROOF_LABELS[massing.roofType]);
  massing.detailTags.push("楼层分缝");
}

function createTower(massing, buildableW, buildableL) {
  const coreArea = massing.footprint * 0.68;
  const side = Math.sqrt(coreArea);
  const w = clamp(side * (0.82 + massing.rng() * 0.35), massing.rules.minDepth, buildableW * 0.5);
  const l = clamp(coreArea / w, massing.rules.minDepth, buildableL * 0.5);
  const baseFloors = clamp(Math.round(massing.floors * 0.18), 2, 6);
  addBlock(massing, { x: 0, z: -l * 0.2, w: w * 1.72, l: l * 0.86, floors: baseFloors, label: "城市基座", roof: "terrace" });
  addBlock(massing, { x: w * 0.12, z: 0, w, l, floors: massing.floors, label: "主塔楼" });
  massing.notes.push("塔楼与基座错位布置，释放地面公共空间。");
}

function createBars(massing, buildableW, buildableL) {
  const barCount = massing.footprint > buildableW * massing.rules.maxDepth * 1.2 ? 2 : 1;
  const depth = clamp(massing.rules.minDepth + massing.rng() * (massing.rules.maxDepth - massing.rules.minDepth), massing.rules.minDepth, buildableL / (barCount * 1.65));
  const eachLength = clamp(massing.footprint / depth / barCount, buildableW * 0.32, buildableW * 0.86);
  const spacing = Math.min(depth * 1.85, buildableL / 3);
  for (let i = 0; i < barCount; i += 1) {
    const z = (i - (barCount - 1) / 2) * spacing;
    addBlock(massing, { x: i % 2 ? eachLength * 0.06 : -eachLength * 0.04, z, w: eachLength, l: depth, floors: massing.floors, label: barCount > 1 ? `错动板楼 ${i + 1}` : "板式体量" });
  }
  massing.notes.push("板式体量带轻微错动，形成朝向清晰的标准层。");
}

function createPodium(massing, buildableW, buildableL) {
  const w = clamp(Math.sqrt(massing.footprint * 1.22), buildableW * 0.45, buildableW * 0.92);
  const l = clamp(massing.footprint / w, buildableL * 0.34, buildableL * 0.82);
  const lowerFloors = clamp(Math.round(massing.floors * 0.62), 1, massing.floors);
  addBlock(massing, { x: 0, z: 0, w, l, floors: lowerFloors, label: "连续基座", roof: "terrace" });
  if (massing.floors > 2) {
    addBlock(massing, { x: -w * 0.16, z: l * 0.09, w: w * 0.58, l: l * 0.42, floors: massing.floors - lowerFloors + 1, floorStart: lowerFloors, yBase: lowerFloors * massing.floorHeight, label: "上部退台", isSetback: true });
  }
  massing.notes.push("连续裙房叠加退台，上部空间可作为露台或屋顶花园。");
}

function createAtrium(massing, buildableW, buildableL) {
  const outerW = clamp(Math.sqrt(massing.footprint * 1.38), buildableW * 0.48, buildableW * 0.88);
  const outerL = clamp(massing.footprint * 1.38 / outerW, buildableL * 0.42, buildableL * 0.84);
  const ring = clamp(Math.min(outerW, outerL) * 0.22, massing.rules.minDepth * 0.55, massing.rules.maxDepth);
  addBlock(massing, { x: 0, z: -outerL / 2 + ring / 2, w: outerW, l: ring, floors: massing.floors, label: "南翼" });
  addBlock(massing, { x: 0, z: outerL / 2 - ring / 2, w: outerW, l: ring, floors: Math.max(1, Math.round(massing.floors * 0.72)), label: "北翼", roof: "green" });
  addBlock(massing, { x: -outerW / 2 + ring / 2, z: 0, w: ring, l: outerL - ring * 2, floors: Math.max(1, Math.round(massing.floors * 0.84)), label: "西翼" });
  addBlock(massing, { x: outerW / 2 - ring / 2, z: 0, w: ring, l: outerL - ring * 2, floors: Math.max(1, Math.round(massing.floors * 0.58)), label: "东翼", roof: "terrace" });
  massing.openSpaces.push({ x: 0, z: 0, w: outerW - ring * 2.2, l: outerL - ring * 2.2, label: "中庭" });
  massing.notes.push("环绕中庭但高度错落，公共空间有更强的层次。");
}

function createCourtyard(massing, buildableW, buildableL) {
  const outerW = clamp(Math.sqrt(massing.footprint * 1.45), buildableW * 0.42, buildableW * 0.88);
  const outerL = clamp(massing.footprint * 1.45 / outerW, buildableL * 0.38, buildableL * 0.8);
  const depth = clamp(Math.min(outerW, outerL) * 0.18, massing.rules.minDepth, massing.rules.maxDepth);
  addBlock(massing, { x: 0, z: -outerL / 2 + depth / 2, w: outerW, l: depth, floors: massing.floors, label: "南侧体量" });
  addBlock(massing, { x: 0, z: outerL / 2 - depth / 2, w: outerW * 0.72, l: depth, floors: Math.max(1, Math.round(massing.floors * 0.8)), label: "北侧退台", isSetback: true });
  addBlock(massing, { x: -outerW / 2 + depth / 2, z: 0, w: depth, l: outerL - depth * 2, floors: Math.max(1, Math.round(massing.floors * 0.72)), label: "西侧体量" });
  addBlock(massing, { x: outerW / 2 - depth / 2, z: 0, w: depth, l: outerL - depth * 2, floors: Math.max(1, Math.round(massing.floors * 0.64)), label: "东侧体量" });
  massing.openSpaces.push({ x: 0, z: 0, w: outerW - depth * 2.4, l: outerL - depth * 2.4, label: "内院" });
  massing.notes.push("院落形体增加内向空间，并通过局部退台降低尺度。");
}

function createCluster(massing, buildableW, buildableL) {
  const count = clamp(Math.round(massing.footprint / 900), 3, 6);
  const blockArea = massing.footprint / count;
  for (let i = 0; i < count; i += 1) {
    const angle = (Math.PI * 2 * i) / count + massing.rng() * 0.26;
    const w = clamp(Math.sqrt(blockArea) * (0.8 + massing.rng() * 0.34), massing.rules.minDepth, buildableW * 0.38);
    const l = clamp(blockArea / w, massing.rules.minDepth, buildableL * 0.35);
    const floorScale = 0.58 + massing.rng() * 0.58;
    addBlock(massing, {
      x: Math.cos(angle) * buildableW * 0.27,
      z: Math.sin(angle) * buildableL * 0.24,
      w,
      l,
      floors: Math.max(1, Math.round(massing.floors * floorScale)),
      label: `错落组团 ${i + 1}`,
    });
  }
  massing.openSpaces.push({ x: 0, z: 0, w: buildableW * 0.24, l: buildableL * 0.2, label: "共享庭院" });
  massing.notes.push("多体量错落排布，适合分期建设和多入口运营。");
}

function createPodiumTower(massing, buildableW, buildableL) {
  const podiumFloors = clamp(Math.round(massing.floors * 0.18), 2, 6);
  const podiumArea = massing.footprint * 0.62;
  const podiumW = clamp(Math.sqrt(podiumArea * 1.35), buildableW * 0.42, buildableW * 0.8);
  const podiumL = clamp(podiumArea / podiumW, buildableL * 0.28, buildableL * 0.62);
  addBlock(massing, { x: 0, z: 0, w: podiumW, l: podiumL, floors: podiumFloors, label: "裙房基座", roof: "terrace" });
  const towerArea = massing.footprint - podiumArea * 0.28;
  const towerW = clamp(Math.sqrt(towerArea) * 0.8, massing.rules.minDepth, buildableW * 0.4);
  const towerL = clamp(towerArea / towerW, massing.rules.minDepth, buildableL * 0.42);
  addBlock(massing, { x: podiumW * 0.12, z: -podiumL * 0.06, w: towerW, l: towerL, floors: massing.floors, label: "偏置塔楼" });
  massing.notes.push("裙房承接城市界面，偏置塔楼形成更明确的开放面。");
}

function createInterlock(massing, buildableW, buildableL) {
  const floorsA = Math.max(2, Math.round(massing.floors * 0.72));
  const floorsB = Math.max(2, Math.round(massing.floors * 0.52));
  const barDepth = clamp(massing.rules.minDepth * 1.15, 12, buildableL * 0.36);
  const long = clamp(Math.sqrt(massing.footprint) * 1.55, buildableW * 0.42, buildableW * 0.82);
  addBlock(massing, { x: -long * 0.08, z: 0, w: long, l: barDepth, floors: floorsA, label: "横向穿插体量" });
  addBlock(massing, { x: long * 0.08, z: 0, w: barDepth * 1.05, l: Math.min(buildableL * 0.78, long * 0.86), floors: floorsB, yBase: Math.max(1, Math.round(floorsA * 0.22)) * massing.floorHeight, floorStart: Math.max(1, Math.round(floorsA * 0.22)), label: "纵向穿插体量", roof: "green" });
  addBlock(massing, { x: -long * 0.34, z: -barDepth * 0.84, w: long * 0.42, l: barDepth * 0.62, floors: Math.max(1, Math.round(massing.floors * 0.22)), label: "入口盒子", roof: "terrace" });
  massing.openSpaces.push({ x: long * 0.26, z: barDepth * 1.2, w: long * 0.22, l: barDepth * 0.8, label: "穿插灰空间" });
  massing.notes.push("横纵体量相互穿插，形成架空入口和多方向城市界面。");
}

function createCantilever(massing, buildableW, buildableL) {
  const baseFloors = clamp(Math.round(massing.floors * 0.36), 2, Math.max(2, massing.floors - 1));
  const baseW = clamp(Math.sqrt(massing.footprint) * 1.15, buildableW * 0.36, buildableW * 0.68);
  const baseL = clamp(baseW * 0.56, massing.rules.minDepth, buildableL * 0.46);
  addBlock(massing, { x: -baseW * 0.08, z: 0, w: baseW, l: baseL, floors: baseFloors, label: "承托基座", roof: "terrace" });
  const topFloors = Math.max(1, massing.floors - Math.round(baseFloors * 0.4));
  addBlock(massing, {
    x: baseW * 0.2,
    z: -baseL * 0.16,
    w: Math.min(buildableW * 0.84, baseW * 1.15),
    l: baseL * 0.82,
    floors: topFloors,
    yBase: baseFloors * massing.floorHeight,
    floorStart: baseFloors,
    label: "悬挑上部体量",
  });
  massing.openSpaces.push({ x: -baseW * 0.48, z: baseL * 0.48, w: baseW * 0.26, l: baseL * 0.6, label: "架空前场" });
  massing.notes.push("上部体量相对基座悬挑，形成入口雨棚和架空灰空间。");
}

function createStepped(massing, buildableW, buildableL) {
  const tiers = clamp(Math.round(massing.floors / 4), 3, 6);
  const tierFloors = Math.max(1, Math.round(massing.floors / tiers));
  const baseW = clamp(Math.sqrt(massing.footprint * 1.1), buildableW * 0.45, buildableW * 0.82);
  const baseL = clamp(massing.footprint / baseW, buildableL * 0.32, buildableL * 0.72);
  for (let i = 0; i < tiers; i += 1) {
    const scale = 1 - i * 0.1;
    const floors = i === tiers - 1 ? Math.max(1, massing.floors - tierFloors * (tiers - 1)) : tierFloors;
    addBlock(massing, {
      x: i * baseW * 0.045,
      z: -i * baseL * 0.035,
      w: baseW * scale,
      l: baseL * scale,
      floors,
      yBase: i * tierFloors * massing.floorHeight,
      floorStart: i * tierFloors,
      label: `退台层 ${i + 1}`,
      roof: i === tiers - 1 ? massing.roofType : "terrace",
      isSetback: i > 0,
    });
  }
  massing.notes.push("多级退台形成连续屋顶平台，体量从地面逐层收分。");
}

function createBridge(massing, buildableW, buildableL) {
  const towerFloors = Math.max(3, massing.floors);
  const towerArea = massing.footprint * 0.34;
  const side = clamp(Math.sqrt(towerArea), massing.rules.minDepth, buildableW * 0.28);
  const gap = clamp(side * 1.45, buildableW * 0.22, buildableW * 0.38);
  addBlock(massing, { x: -gap / 2, z: 0, w: side, l: side * 1.12, floors: towerFloors, label: "西侧塔体" });
  addBlock(massing, { x: gap / 2, z: 0, w: side, l: side * 1.12, floors: Math.max(2, Math.round(towerFloors * 0.86)), label: "东侧塔体", roof: "green" });
  const bridgeFloors = clamp(Math.round(massing.floors * 0.14), 1, 3);
  const bridgeStart = clamp(Math.round(massing.floors * 0.42), 2, Math.max(2, massing.floors - bridgeFloors));
  addBlock(massing, {
    x: 0,
    z: -side * 0.06,
    w: gap + side * 0.48,
    l: side * 0.38,
    floors: bridgeFloors,
    yBase: bridgeStart * massing.floorHeight,
    floorStart: bridgeStart,
    label: "空中连桥",
    roof: "flat",
  });
  massing.openSpaces.push({ x: 0, z: side * 0.8, w: gap * 0.62, l: side * 0.5, label: "塔间广场" });
  massing.notes.push("双体量由空中连桥连接，地面形成通透的塔间广场。");
}

function createFreeMix(massing, buildableW, buildableL) {
  const operations = [
    addCrossInsert,
    addHighInsert,
    addLowMat,
    addCantileverPiece,
    addSetbackStack,
    addTowerPiece,
    addBridgePiece,
    addVoidPiece,
  ];
  const count = randomInt(massing.rng, 5, 9);
  for (let i = 0; i < count; i += 1) {
    pick(massing.rng, operations)(massing, buildableW, buildableL, i);
  }
  massing.notes.push("自由组合多种体量操作，每次生成都会重新混合穿插、悬挑、退台与连桥。");
}

function createMultiInterlock(massing, buildableW, buildableL) {

  const baseDepth = clamp(randomBetween(massing.rng, massing.rules.minDepth * 0.9, massing.rules.maxDepth * 1.25), 10, buildableL * 0.34);
  for (let i = 0; i < layers; i += 1) {
    const horizontal = i % 2 === 0;
    const floorStart = i === 0 ? 0 : randomInt(massing.rng, 0, Math.max(1, Math.floor(massing.floors * 0.62)));
    const floors = randomInt(massing.rng, 1, Math.max(2, Math.ceil(massing.floors * randomBetween(massing.rng, 0.22, 0.72))));
    addBlock(massing, {
      x: randomBetween(massing.rng, -buildableW * 0.18, buildableW * 0.18),
      z: randomBetween(massing.rng, -buildableL * 0.18, buildableL * 0.18),
      w: horizontal ? baseLength * randomBetween(massing.rng, 0.62, 1.05) : baseDepth * randomBetween(massing.rng, 0.8, 1.35),
      l: horizontal ? baseDepth * randomBetween(massing.rng, 0.8, 1.35) : Math.min(buildableL * 0.82, baseLength * randomBetween(massing.rng, 0.58, 0.98)),
      floors,
      yBase: floorStart * massing.floorHeight,
      floorStart,
      label: horizontal ? `横向穿插 ${i + 1}` : `纵向穿插 ${i + 1}`,
      roof: pick(massing.rng, [massing.roofType, "green", "terrace", "flat"]),

  massing.notes.push("多层级穿插体量在不同高度交错，形成架空、咬合和屋顶平台。");
}

function createPorousMat(massing, buildableW, buildableL) {

        massing.openSpaces.push({
          x: (col - (cols - 1) / 2) * cellW,

  addBridgePiece(massing, buildableW, buildableL, 99);

function createPinwheel(massing, buildableW, buildableL) {
  const arms = randomInt(massing.rng, 4, 6);
  const length = randomBetween(massing.rng, Math.min(buildableW, buildableL) * 0.34, Math.min(buildableW, buildableL) * 0.62);

  for (let i = 0; i < arms; i += 1) {

    const horizontal = Math.abs(Math.cos(angle)) > Math.abs(Math.sin(angle));
    addBlock(massing, {
      x: Math.cos(angle) * length * 0.22,
      z: Math.sin(angle) * length * 0.22,
      w: horizontal ? length : depth,
      l: horizontal ? depth : length,
      floors: randomInt(massing.rng, Math.max(1, Math.floor(massing.floors * 0.22)), Math.max(2, massing.floors)),
      yBase: i % 2 ? randomInt(massing.rng, 0, Math.max(1, Math.floor(massing.floors * 0.22))) * massing.floorHeight : 0,
      floorStart: i % 2 ? randomInt(massing.rng, 0, Math.max(1, Math.floor(massing.floors * 0.22))) : 0,

      roof: pick(massing.rng, ["flat", "green", "terrace", massing.roofType]),

function setupScene() {
  scene = new THREE.Scene();
  scene.background = new THREE.Color("#eef2f4");

  camera = new THREE.PerspectiveCamera(45, canvasHost.clientWidth / canvasHost.clientHeight, 0.1, 5000);
  camera.position.set(180, 150, 210);

  renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false, preserveDrawingBuffer: true });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.setSize(canvasHost.clientWidth, canvasHost.clientHeight);
  renderer.shadowMap.enabled = true;
  canvasHost.appendChild(renderer.domElement);

  controls = new OrbitControls(camera, renderer.domElement);
  controls.enableDamping = true;
  controls.target.set(0, 24, 0);

  scene.add(new THREE.HemisphereLight("#ffffff", "#7b8794", 2.1));
  const sun = new THREE.DirectionalLight("#ffffff", 2.5);
  sun.position.set(130, 230, 90);
  sun.castShadow = true;
  sun.shadow.camera.left = -320;
  sun.shadow.camera.right = 320;
  sun.shadow.camera.top = 320;
  sun.shadow.camera.bottom = -320;
  scene.add(sun);

  const grid = new THREE.GridHelper(700, 28, "#94a3b8", "#d0d7de");
  grid.position.y = -0.02;
  scene.add(grid);

  window.addEventListener("resize", resizeScene);
  resizeObserver = new ResizeObserver(resizeScene);
  resizeObserver.observe(canvasHost);
  requestAnimationFrame(resizeScene);
  animate();
}

function resizeScene() {
  if (!renderer) return;
  const width = Math.max(1, canvasHost.clientWidth);
  const height = Math.max(1, canvasHost.clientHeight);
  camera.aspect = width / height;
  camera.updateProjectionMatrix();
  renderer.setSize(width, height, false);
}

function clearCurrentGroup() {
  if (!currentGroup) return;
  scene.remove(currentGroup);
  currentGroup.traverse((object) => {
    if (object.geometry) object.geometry.dispose();
    if (object.material) object.material.dispose();
  });
}

function makeSiteShape(points) {
  const shape = new THREE.Shape();
  shape.moveTo(points[0].x, points[0].z);
  points.slice(1).forEach((point) => shape.lineTo(point.x, point.z));
  shape.lineTo(points[0].x, points[0].z);
  return shape;
}

function drawScheme(scheme) {
  clearCurrentGroup();
  currentGroup = new THREE.Group();

  const siteGeometry = new THREE.ShapeGeometry(makeSiteShape(scheme.site.points));
  const site = new THREE.Mesh(siteGeometry, new THREE.MeshStandardMaterial({ color: "#dfe7df", roughness: 0.88, side: THREE.DoubleSide }));
  site.rotation.x = -Math.PI / 2;
  site.receiveShadow = true;
  currentGroup.add(site);

  const edge = new THREE.LineSegments(new THREE.EdgesGeometry(siteGeometry), new THREE.LineBasicMaterial({ color: "#50645a" }));
  edge.rotation.x = -Math.PI / 2;
  edge.position.y = 0.08;
  currentGroup.add(edge);

  scheme.openSpaces.forEach((space) => {
    const mesh = new THREE.Mesh(
      new THREE.BoxGeometry(space.w, 0.3, space.l),
      new THREE.MeshStandardMaterial({ color: "#8db89b", roughness: 0.75 }),
    );
    mesh.position.set(space.x, 0.18, space.z);
    currentGroup.add(mesh);
  });

  scheme.blocks.forEach((block) => drawBlock(block, scheme));

  scene.add(currentGroup);
  const maxDim = Math.max(scheme.siteWidth, scheme.siteLength, scheme.height, 90);
  camera.position.set(maxDim * 0.92, maxDim * 0.78, maxDim * 1.12);
  controls.target.set(0, Math.min(55, scheme.height * 0.36), 0);
  controls.update();
}

function drawBlock(block, scheme) {
  const geometry = new THREE.BoxGeometry(block.w, block.h, block.l);
  const material = new THREE.MeshStandardMaterial({
    color: block.color,
    roughness: 0.56,
    metalness: 0.03,
  });
  const mesh = new THREE.Mesh(geometry, material);
  mesh.position.set(block.x, block.yBase + block.h / 2, block.z);
  mesh.castShadow = true;
  mesh.receiveShadow = true;
  currentGroup.add(mesh);

  const edges = new THREE.LineSegments(
    new THREE.EdgesGeometry(geometry),
    new THREE.LineBasicMaterial({ color: "#1f2937", transparent: true, opacity: 0.22 }),
  );
  edges.position.copy(mesh.position);
  currentGroup.add(edges);

  drawFloorLines(block, scheme);
  drawRoof(block, scheme);
  drawStructuralSupports(block, scheme);
}

function drawStructuralSupports(block, scheme) {
  if (block.yBase < 1.2) return;
  if (isRestingOnLowerBlock(block, scheme)) return;
  const columnHeight = block.yBase;
  const radius = clamp(Math.min(block.w, block.l) * 0.035, 0.32, 1.15);
  const insetX = Math.min(block.w * 0.28, Math.max(2, radius * 3.2));
  const insetZ = Math.min(block.l * 0.28, Math.max(2, radius * 3.2));
  const columns = [];
  const xPositions = block.w > 46
    ? [block.x - block.w / 2 + insetX, block.x, block.x + block.w / 2 - insetX]
    : [block.x - block.w / 2 + insetX, block.x + block.w / 2 - insetX];
  const zPositions = block.l > 38
    ? [block.z - block.l / 2 + insetZ, block.z, block.z + block.l / 2 - insetZ]
    : [block.z - block.l / 2 + insetZ, block.z + block.l / 2 - insetZ];

  xPositions.forEach((x) => {
    columns.push({ x, z: zPositions[0] });
    columns.push({ x, z: zPositions[zPositions.length - 1] });
  });
  if (block.w * block.l > 1400) {
    zPositions.forEach((z) => columns.push({ x: block.x, z }));
  }

  const material = new THREE.MeshStandardMaterial({ color: "#4b5563", roughness: 0.72 });
  columns.forEach((column) => {
    const geometry = new THREE.CylinderGeometry(radius, radius, columnHeight, 12);
    const mesh = new THREE.Mesh(geometry, material);
    mesh.position.set(column.x, columnHeight / 2, column.z);
    mesh.castShadow = true;
    mesh.receiveShadow = true;
    currentGroup.add(mesh);
  });
}

function isRestingOnLowerBlock(block, scheme) {
  return scheme.blocks.some((other) => {
    if (other === block) return false;
    const top = other.yBase + other.h;
    if (Math.abs(top - block.yBase) > 1.2) return false;
    const a = blockRange(block);
    const b = blockRange(other);
    const overlapX = Math.min(a.maxX, b.maxX) - Math.max(a.minX, b.minX);
    const overlapZ = Math.min(a.maxZ, b.maxZ) - Math.max(a.minZ, b.minZ);
    const overlapArea = Math.max(0, overlapX) * Math.max(0, overlapZ);
    return overlapArea > block.w * block.l * 0.18;
  });
}

function drawFloorLines(block, scheme) {
  const step = block.floors > 34 ? 2 : 1;
  const points = [];
  for (let floor = step; floor < block.floors; floor += step) {
    const y = block.yBase + floor * scheme.floorHeight;
    const x0 = block.x - block.w / 2 - 0.04;
    const x1 = block.x + block.w / 2 + 0.04;
    const z0 = block.z - block.l / 2 - 0.04;
    const z1 = block.z + block.l / 2 + 0.04;
    points.push(x0, y, z0, x1, y, z0, x1, y, z0, x1, y, z1, x1, y, z1, x0, y, z1, x0, y, z1, x0, y, z0);
  }
  if (!points.length) return;
  const geometry = new THREE.BufferGeometry();
  geometry.setAttribute("position", new THREE.Float32BufferAttribute(points, 3));
  const lines = new THREE.LineSegments(geometry, new THREE.LineBasicMaterial({ color: "#ffffff", transparent: true, opacity: 0.45 }));
  currentGroup.add(lines);
}

function drawRoof(block) {
  const roof = block.roof || "flat";
  if (roof === "flat") {
    addRoofSlab(block, "#f4efe3", 0.35);
    return;
  }
  if (roof === "terrace") {
    addRoofSlab(block, "#d7b86b", 0.42);
    addParapet(block);
    return;
  }
  if (roof === "green") {
    addRoofSlab(block, "#79a86f", 0.46);
    return;
  }
  if (roof === "pitched") {
    const roofMesh = new THREE.Mesh(createGableGeometry(block.w, block.l, Math.min(8, block.h * 0.22)), new THREE.MeshStandardMaterial({ color: "#9b5b49", roughness: 0.7 }));
    roofMesh.position.set(block.x, block.yBase + block.h, block.z);
    roofMesh.castShadow = true;
    currentGroup.add(roofMesh);
    return;
  }
  if (roof === "sawtooth") {
    const count = clamp(Math.round(block.w / 18), 2, 6);
    for (let i = 0; i < count; i += 1) {
      const segmentW = block.w / count;
      const roofMesh = new THREE.Mesh(createGableGeometry(segmentW * 0.92, block.l, Math.min(5, block.h * 0.16)), new THREE.MeshStandardMaterial({ color: "#b8c2c7", roughness: 0.62 }));
      roofMesh.position.set(block.x - block.w / 2 + segmentW * (i + 0.5), block.yBase + block.h, block.z);
      currentGroup.add(roofMesh);
    }
  }
}

function addRoofSlab(block, color, thickness) {
  const mesh = new THREE.Mesh(new THREE.BoxGeometry(block.w * 1.02, thickness, block.l * 1.02), new THREE.MeshStandardMaterial({ color, roughness: 0.72 }));
  mesh.position.set(block.x, block.yBase + block.h + thickness / 2, block.z);
  mesh.castShadow = true;
  currentGroup.add(mesh);
}

function addParapet(block) {
  const h = 0.7;
  const t = 0.5;
  const pieces = [
    { w: block.w + t, l: t, x: block.x, z: block.z - block.l / 2 },
    { w: block.w + t, l: t, x: block.x, z: block.z + block.l / 2 },
    { w: t, l: block.l + t, x: block.x - block.w / 2, z: block.z },
    { w: t, l: block.l + t, x: block.x + block.w / 2, z: block.z },
  ];
  pieces.forEach((piece) => {
    const mesh = new THREE.Mesh(new THREE.BoxGeometry(piece.w, h, piece.l), new THREE.MeshStandardMaterial({ color: "#c7b77a", roughness: 0.8 }));
    mesh.position.set(piece.x, block.yBase + block.h + h / 2, piece.z);
    currentGroup.add(mesh);
  });
}

function createGableGeometry(width, length, height) {
  const w = width / 2;
  const l = length / 2;
  const vertices = new Float32Array([
    -w, 0, -l, w, 0, -l, 0, height, -l,
    -w, 0, l, 0, height, l, w, 0, l,
    -w, 0, -l, -w, 0, l, 0, height, l,
    -w, 0, -l, 0, height, l, 0, height, -l,
    w, 0, -l, 0, height, -l, 0, height, l,
    w, 0, -l, 0, height, l, w, 0, l,
    -w, 0, -l, -w, 0, l, w, 0, l,
    -w, 0, -l, w, 0, l, w, 0, -l,
  ]);
  const geometry = new THREE.BufferGeometry();
  geometry.setAttribute("position", new THREE.BufferAttribute(vertices, 3));
  geometry.computeVertexNormals();
  return geometry;
}

function animate() {
  animationId = requestAnimationFrame(animate);
  controls.update();
  renderer.render(scene, camera);
}

function getInput() {
  const data = new FormData(form);
  return {
    type: data.get("type"),
    buildingArea: Number(data.get("buildingArea")),
    siteArea: Number(data.get("siteArea")),
    siteRatio: Number(data.get("siteRatio")),
    siteMode: data.get("siteMode"),
    sitePoints: [...state.sitePoints],
    floorMode: data.get("floorMode"),
    manualFloors: Number(data.get("manualFloors")) || 0,
    manualHeight: Number(data.get("manualHeight")) || 0,
    roofType: data.get("roofType"),
    seed: state.seed,
  };
}

function applyInput(input) {
  Object.assign(state, input);
  state.generated = generateSchemes(state, INITIAL_SCHEME_COUNT, 0);
  state.schemeCursor = state.generated.length;
  state.optionIndex = 0;
  renderAll();
}

function appendMoreSchemes() {
  Object.assign(state, getInput());
  const more = generateSchemes(state, MORE_SCHEME_COUNT, state.schemeCursor);
  state.generated.push(...more);
  state.schemeCursor += more.length;
  renderAll();
  const active = optionList.querySelector(".option.active");
  active?.scrollIntoView({ block: "nearest" });
}

function renderAll() {
  const selected = state.generated[state.optionIndex];
  if (!selected) return;
  renderMetrics(selected);
  renderOptions();
  drawScheme(selected);
  schemeTitle.textContent = selected.name;
  schemeSubtitle.textContent = `${BUILDING_RULES[selected.type].label} / ${formName(selected.form)} / ${selected.floors} 层 / ${ROOF_LABELS[selected.roofType]}`;
  infoStrip.innerHTML = `
    <span>建筑面积 <b>${formatNumber(selected.buildingArea)}</b> m²</span>
    <span>占地 <b>${formatNumber(selected.footprint)}</b> m²</span>
    <span>建筑高度 <b>${formatNumber(selected.height)}</b> m</span>
    <span>${selected.notes[0]}</span>
  `;
}

function renderMetrics(scheme) {
  metricsEl.innerHTML = `
    <article>
      <span>容积率</span>
      <strong>${formatNumber(scheme.far)}</strong>
    </article>
    <article>
      <span>覆盖率</span>
      <strong>${formatNumber(scheme.coverage * 100)}%</strong>
    </article>
    <article>
      <span>层数 / 高度</span>
      <strong>${scheme.floors}F / ${formatNumber(scheme.height)}m</strong>
    </article>
    <article>
      <span>基地包络</span>
      <strong>${formatNumber(scheme.siteLength)} × ${formatNumber(scheme.siteWidth)}</strong>
    </article>
  `;
}

function renderOptions() {
  optionList.innerHTML = "";
  state.generated.forEach((scheme, index) => {
    const button = document.createElement("button");
    button.type = "button";
    button.className = `option ${index === state.optionIndex ? "active" : ""}`;
    button.innerHTML = `
      <span>
        <strong>${scheme.name}</strong>
        <em>${formName(scheme.form)} · ${scheme.blocks.length} 个体量 · ${scheme.detailTags.join(" / ")}</em>
      </span>
      <b>${scheme.floors}F</b>
    `;
    button.addEventListener("click", () => {
      state.optionIndex = index;
      renderAll();
    });
    optionList.appendChild(button);
  });
  const counter = document.createElement("div");
  counter.className = "optionCounter";
  counter.textContent = `已生成 ${state.generated.length} 个方案，可继续追加`;
  optionList.appendChild(counter);
}

function formName(form) {
  const names = {
    slab: "板式",
    bar: "条形",
    tower: "塔楼基座",
    podium: "连续退台",
    atrium: "中庭错落",
    courtyard: "院落围合",
    cluster: "错落组团",
    podiumTower: "裙房塔楼",
    interlock: "穿插体量",
    cantilever: "悬挑体量",
    stepped: "退台堆叠",
    bridge: "双塔连桥",
    freeMix: "自由混合",
    multiInterlock: "多重穿插",
    porousMat: "多孔基底",
    cantileverChain: "连续悬挑",
    pinwheel: "风车穿插",
    terraceVillage: "台地聚落",
  };
  return names[form] || form;
}

function exportCurrent() {
  const selected = state.generated[state.optionIndex];
  const blob = new Blob([JSON.stringify(selected, null, 2)], { type: "application/json" });
  const url = URL.createObjectURL(blob);
  const link = document.createElement("a");
  link.href = url;
  link.download = `massing-${selected.name.replace(" ", "-")}.json`;
  link.click();
  URL.revokeObjectURL(url);
}

function renderSketch() {
  const pointText = state.sitePoints.map((point) => `${point.x},${point.y}`).join(" ");
  siteSketch.innerHTML = `
    <rect x="1" y="1" width="358" height="218" rx="8"></rect>
    <polyline points="${pointText}" class="sketchLine"></polyline>
    ${state.sitePoints.map((point, index) => `<circle data-index="${index}" cx="${point.x}" cy="${point.y}" r="${index === state.selectedSitePoint ? 7 : 5}" class="${index === state.selectedSitePoint ? "selected" : ""}"></circle><text x="${point.x + 8}" y="${point.y - 8}">${index + 1}</text>`).join("")}
  `;
}

function sketchPointFromEvent(event) {
  const rect = siteSketch.getBoundingClientRect();
  return {
    x: clamp(((event.clientX - rect.left) / rect.width) * 360, 8, 352),
    y: clamp(((event.clientY - rect.top) / rect.height) * 220, 8, 212),
  };
}

function refreshFromSketchEdit() {
  renderSketch();
  if (new FormData(form).get("siteMode") === "free" && state.sitePoints.length >= 3) {
    applyInput(getInput());
  }
}

function updateSiteMode() {
  const mode = new FormData(form).get("siteMode");
  siteEditor.hidden = mode !== "free";
  ratioControl.hidden = mode === "free";
}

form.addEventListener("submit", (event) => {
  event.preventDefault();
  applyInput(getInput());
});

form.siteRatio.addEventListener("input", () => {
  ratioOut.value = Number(form.siteRatio.value).toFixed(2);
});

form.querySelectorAll('input[name="siteMode"]').forEach((radio) => {
  radio.addEventListener("change", () => {
    updateSiteMode();
    applyInput(getInput());
  });
});

siteSketch.addEventListener("pointerdown", (event) => {
  const target = event.target.closest?.("circle[data-index]");
  if (target) {
    state.selectedSitePoint = Number(target.dataset.index);
  } else {
    state.sitePoints.push(sketchPointFromEvent(event));
    state.selectedSitePoint = state.sitePoints.length - 1;
  }
  state.draggingSitePoint = true;
  siteSketch.setPointerCapture?.(event.pointerId);
  refreshFromSketchEdit();
});

siteSketch.addEventListener("pointermove", (event) => {
  if (!state.draggingSitePoint || state.selectedSitePoint < 0) return;
  state.sitePoints[state.selectedSitePoint] = sketchPointFromEvent(event);
  refreshFromSketchEdit();
});

siteSketch.addEventListener("pointerup", (event) => {
  state.draggingSitePoint = false;
  siteSketch.releasePointerCapture?.(event.pointerId);
  refreshFromSketchEdit();
});

window.addEventListener("keydown", (event) => {
  if (!["Delete", "Backspace"].includes(event.key)) return;
  if (state.selectedSitePoint < 0 || state.sitePoints.length <= 3) return;
  const active = document.activeElement;
  if (active && ["INPUT", "SELECT", "TEXTAREA"].includes(active.tagName)) return;
  state.sitePoints.splice(state.selectedSitePoint, 1);
  state.selectedSitePoint = Math.min(state.selectedSitePoint, state.sitePoints.length - 1);
  refreshFromSketchEdit();
});

document.querySelector("#resetSiteButton").addEventListener("click", () => {
  state.sitePoints = [];
  state.selectedSitePoint = -1;
  renderSketch();
  applyInput(getInput());
});

document.querySelector("#shuffleButton").addEventListener("click", () => {
  state.seed += 13;
  applyInput(getInput());
});

document.querySelector("#loadMoreButton").addEventListener("click", () => {
  state.seed += 29;
  appendMoreSchemes();
});

document.querySelector("#exportButton").addEventListener("click", exportCurrent);

renderSketch();
updateSiteMode();
setupScene();
applyInput(getInput());

window.addEventListener("beforeunload", () => {
  cancelAnimationFrame(animationId);
  resizeObserver?.disconnect();
});

  </script>
</body>
</html>

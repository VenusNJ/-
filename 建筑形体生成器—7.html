function setupScene() {
  scene = new THREE.Scene();
  scene.background = new THREE.Color("#eef2f4");

  const initW = Math.max(canvasHost.clientWidth || 800, 400);
  const initH = Math.max(canvasHost.clientHeight || 600, 300);
  camera = new THREE.PerspectiveCamera(45, initW / initH, 0.1, 5000);
  camera.position.set(180, 150, 210);

  renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false, preserveDrawingBuffer: true });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.setSize(initW, initH);
  renderer.shadowMap.enabled = true;
  renderer.logarithmicDepthBuffer = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 1.02;
  canvasHost.appendChild(renderer.domElement);

  controls = new OrbitControls(camera, renderer.domElement);
  controls.enableDamping = true;
  controls.target.set(0, 24, 0);

  scene.add(new THREE.HemisphereLight("#f9f6f0", "#8b959d", 1.7));
  const sun = new THREE.DirectionalLight("#fffdf7", 3.2);
  sun.position.set(180, 280, 120);
  sun.castShadow = true;
  sun.shadow.mapSize.width = 8192;
  sun.shadow.mapSize.height = 8192;
  sun.shadow.camera.near = 1;
  sun.shadow.camera.far = 1200;
  sun.shadow.camera.left = -120;
  sun.shadow.camera.right = 120;
  sun.shadow.camera.top = 120;
  sun.shadow.camera.bottom = -120;
  sun.shadow.bias = -0.0005;
  sun.shadow.normalBias = 0.03;
  scene.add(sun);

  const grid = new THREE.GridHelper(700, 28, "#94a3b8", "#d0d7de");
  grid.position.y = -0.02;
  scene.add(grid);

  window.addEventListener("resize", resizeScene);
  resizeObserver = new ResizeObserver(resizeScene);
  resizeObserver.observe(canvasHost);
  requestAnimationFrame(resizeScene);
  animate();
}

function resizeScene() {
  if (!renderer) return;
  const width = Math.max(1, canvasHost.clientWidth);
  const height = Math.max(1, canvasHost.clientHeight);
  camera.aspect = width / height;
  camera.updateProjectionMatrix();
  renderer.setSize(width, height, false);
}

function clearCurrentGroup() {
  if (!currentGroup) return;
  scene.remove(currentGroup);
  currentGroup.traverse((object) => {
    if (object.geometry) object.geometry.dispose();
    if (object.material) object.material.dispose();
  });
}

function makeSiteShape(points) {
  const shape = new THREE.Shape();
  shape.moveTo(points[0].x, points[0].z);
  points.slice(1).forEach((point) => shape.lineTo(point.x, point.z));
  shape.lineTo(points[0].x, points[0].z);
  return shape;
}

function mergeBlocksCSG(scheme) {
  // Use CSG union to merge all blocks into a single mesh, eliminating internal faces
  if (scheme.blocks.length < 2) return null;
  try {
    let result = null;
    scheme.blocks.forEach((block, i) => {
      const geo = new THREE.BoxGeometry(block.w, block.h, block.l);
      const mat = new THREE.MeshStandardMaterial({
        color: block.color,
        roughness: 0.56,
        metalness: 0.03,
          });
      const mesh = new THREE.Mesh(geo, mat);
      mesh.position.set(block.x, block.yBase + block.h / 2, block.z);
      mesh.updateMatrixWorld();
      if (i === 0) {
        result = CSG.fromMesh(mesh);
      } else {
        const next = CSG.fromMesh(mesh);
        result = result.union(next);
      }
    });
    // Convert back to mesh
    const mergedMesh = CSG.toMesh(result, new THREE.Matrix4(), new THREE.MeshStandardMaterial({
      color: scheme.blocks[0].color,
      roughness: 0.56,
      metalness: 0.03,
      }));
    return mergedMesh;
  } catch(e) {
    return null;
  }
}

function drawScheme(scheme) {
  clearCurrentGroup();
  currentGroup = new THREE.Group();

  const siteGeometry = new THREE.ShapeGeometry(makeSiteShape(scheme.site.points));
  const site = new THREE.Mesh(siteGeometry, new THREE.MeshStandardMaterial({ color: "#dfe7df", roughness: 0.88, side: THREE.DoubleSide, polygonOffset: true, polygonOffsetFactor: 1, polygonOffsetUnits: 2 }));
  site.position.y = -0.04;
  site.rotation.x = -Math.PI / 2;
  site.receiveShadow = true;
  currentGroup.add(site);

  const edge = new THREE.LineSegments(new THREE.EdgesGeometry(siteGeometry), new THREE.LineBasicMaterial({ color: "#50645a", depthWrite: false }));
  edge.rotation.x = -Math.PI / 2;
  edge.position.y = 0.08;
  currentGroup.add(edge);

  scheme.openSpaces.forEach((space) => {
    const mesh = new THREE.Mesh(
      new THREE.BoxGeometry(space.w, 0.3, space.l),
      new THREE.MeshStandardMaterial({ color: "#8db89b", roughness: 0.75 }),
    );
    mesh.position.set(space.x, 0.18, space.z);
    currentGroup.add(mesh);
  });

    scheme.blocks.forEach((block) => drawBlock(block, scheme));

  scene.add(currentGroup);
  const maxDim = Math.max(scheme.siteWidth, scheme.siteLength, scheme.height, 90);
  camera.position.set(maxDim * 0.92, maxDim * 0.78, maxDim * 1.12);
  controls.target.set(0, Math.min(55, scheme.height * 0.36), 0);
  controls.update();
}

function drawBlock(block, scheme) {
  const geometry = new THREE.BoxGeometry(block.w, block.h, block.l);
  const material = new THREE.MeshStandardMaterial({
    color: block.color,
    roughness: 0.56,
    metalness: 0.03,
    polygonOffset: true,
    polygonOffsetFactor: 4,
    polygonOffsetUnits: 1,
  });
  const mesh = new THREE.Mesh(geometry, material);
  mesh.position.set(block.x, block.yBase + block.h / 2, block.z);
  mesh.castShadow = true;
  mesh.receiveShadow = true;
  currentGroup.add(mesh);

  const edges = new THREE.LineSegments(
    new THREE.EdgesGeometry(geometry),
    new THREE.LineBasicMaterial({ color: "#1f2937", transparent: true, opacity: 0.22, depthWrite: false }),
  );
  edges.position.copy(mesh.position);
      currentGroup.add(edges);

  
  drawRoof(block, scheme);
  drawStructuralSupports(block, scheme);
}


function getBlockColumns(block, scheme) {
  // Only add columns under elevated blocks (yBase > 0)
  if (block.yBase < 0.5) return [];
  
  const cols = [];
  const hw = block.w / 2, hl = block.l / 2;
  const colRadius = 0.6;
  const colHeight = block.yBase;
  
  // 4 corners - outer perimeter only
  cols.push({ x: block.x - hw + 1.2, z: block.z - hl + 1.2, radius: colRadius, columnHeight: colHeight });
  cols.push({ x: block.x + hw - 1.2, z: block.z - hl + 1.2, radius: colRadius, columnHeight: colHeight });
  cols.push({ x: block.x + hw - 1.2, z: block.z + hl - 1.2, radius: colRadius, columnHeight: colHeight });
  cols.push({ x: block.x - hw + 1.2, z: block.z + hl - 1.2, radius: colRadius, columnHeight: colHeight });
  
  // Midpoint columns only for longer sides (>18m)
  if (block.w > 18) {
    cols.push({ x: block.x, z: block.z - hl + 1.0, radius: colRadius, columnHeight: colHeight });
    cols.push({ x: block.x, z: block.z + hl - 1.0, radius: colRadius, columnHeight: colHeight });
  }
  if (block.l > 18) {
    cols.push({ x: block.x - hw + 1.0, z: block.z, radius: colRadius, columnHeight: colHeight });
    cols.push({ x: block.x + hw - 1.0, z: block.z, radius: colRadius, columnHeight: colHeight });
  }
  
  return cols;
}
function drawStructuralSupports(block, scheme) {
  const cols = getBlockColumns(block, scheme);
  if (!cols.length) return;
  const material = new THREE.MeshStandardMaterial({ color: "#4b5563", roughness: 0.72 });
  cols.forEach((col) => {
    const geometry = new THREE.CylinderGeometry(col.radius, col.radius, col.columnHeight, 10);
    const mesh = new THREE.Mesh(geometry, material);
    mesh.position.set(col.x, col.columnHeight / 2, col.z);
    mesh.castShadow = true;
    mesh.receiveShadow = true;
    currentGroup.add(mesh);
  });
}

function isRestingOnLowerBlock(block, scheme) {
  return getRestingInfo(block, scheme).supported;
}

function getRestingInfo(block, scheme) {
  let maxOverlap = 0;
  let restingOn = null;
  scheme.blocks.forEach((other) => {
    if (other === block) return;
    const top = other.yBase + other.h;
    if (Math.abs(top - block.yBase) > 1.5) return;
    const a = blockRange(block);
    const b = blockRange(other);
    const overlapX = Math.min(a.maxX, b.maxX) - Math.max(a.minX, b.minX);
    const overlapZ = Math.min(a.maxZ, b.maxZ) - Math.max(a.minZ, b.minZ);
    const overlapArea = Math.max(0, overlapX) * Math.max(0, overlapZ);
    if (overlapArea > maxOverlap) {
      maxOverlap = overlapArea;
      restingOn = other;
    }
  });
  const overlapRatio = block.w * block.l > 0 ? maxOverlap / (block.w * block.l) : 0;
  return {
    supported: overlapRatio > 0.15,
    overlapRatio,
    restingOn,
  };
}

function drawFloorLines(block, scheme) {
  const step = block.floors > 30 ? 2 : 1;
  const pts = [];
  const yOff = 0.08;
  for (let f = step; f < block.floors; f += step) {
    const y = block.yBase + f * scheme.floorHeight + yOff;
    pts.push(block.x - block.w / 2 - 0.02, y, block.z - block.l / 2 - 0.02, block.x + block.w / 2 + 0.02, y, block.z - block.l / 2 - 0.02,
             block.x + block.w / 2 + 0.02, y, block.z - block.l / 2 - 0.02, block.x + block.w / 2 + 0.02, y, block.z + block.l / 2 + 0.02,
             block.x + block.w / 2 + 0.02, y, block.z + block.l / 2 + 0.02, block.x - block.w / 2 - 0.02, y, block.z + block.l / 2 + 0.02,
             block.x - block.w / 2 - 0.02, y, block.z + block.l / 2 + 0.02, block.x - block.w / 2 - 0.02, y, block.z - block.l / 2 - 0.02);
  }
  if (!pts.length) return;
  const g = new THREE.BufferGeometry();
  g.setAttribute("position", new THREE.Float32BufferAttribute(pts, 3));
  const lines = new THREE.LineSegments(g, new THREE.LineBasicMaterial({ color: "#ffffff", transparent: true, opacity: 0.4, depthTest: true, depthWrite: false }));
  lines.renderOrder = 2;
  currentGroup.add(lines);
}

function drawRoof(block) {
  const roof = block.roof || "flat";
  if (roof === "flat") {
    addRoofSlab(block, "#f4efe3", 0.35);
    return;
  }
  if (roof === "terrace") {
    addRoofSlab(block, "#d7b86b", 0.42);
    addParapet(block);
    return;
  }
  if (roof === "green") {
    addRoofSlab(block, "#79a86f", 0.46);
    return;
  }
  if (roof === "pitched") {
    const roofMesh = new THREE.Mesh(createGableGeometry(block.w, block.l, Math.min(8, block.h * 0.22)), new THREE.MeshStandardMaterial({ color: "#9b5b49", roughness: 0.7, polygonOffset: true, polygonOffsetFactor: 1, polygonOffsetUnits: 1 }));
    roofMesh.position.set(block.x, block.yBase + block.h + 0.15, block.z);
    roofMesh.castShadow = true;
    currentGroup.add(roofMesh);
    return;
  }
  if (roof === "sawtooth") {
    const count = clamp(Math.round(block.w / 18), 2, 6);
    for (let i = 0; i < count; i += 1) {
      const segmentW = block.w / count;
      const roofMesh = new THREE.Mesh(createGableGeometry(segmentW * 0.92, block.l, Math.min(5, block.h * 0.16)), new THREE.MeshStandardMaterial({ color: "#b8c2c7", roughness: 0.62, polygonOffset: true, polygonOffsetFactor: 1, polygonOffsetUnits: 1 }));
      roofMesh.position.set(block.x - block.w / 2 + segmentW * (i + 0.5), block.yBase + block.h + 0.15, block.z);
      currentGroup.add(roofMesh);
    }
  }
}

function addRoofSlab(block, color, thickness) {
  const mesh = new THREE.Mesh(new THREE.BoxGeometry(block.w * 1.02, thickness, block.l * 1.02), new THREE.MeshStandardMaterial({ color, roughness: 0.72, polygonOffset: true, polygonOffsetFactor: 1, polygonOffsetUnits: 1 }));
  mesh.position.set(block.x, block.yBase + block.h + thickness / 2, block.z);
  mesh.castShadow = true;
  currentGroup.add(mesh);
}

function addParapet(block) {
  const h = 0.7;
  const t = 0.5;
  const pieces = [
    { w: block.w + t, l: t, x: block.x, z: block.z - block.l / 2 },
    { w: block.w + t, l: t, x: block.x, z: block.z + block.l / 2 },
    { w: t, l: block.l + t, x: block.x - block.w / 2, z: block.z },
    { w: t, l: block.l + t, x: block.x + block.w / 2, z: block.z },
  ];
  pieces.forEach((piece) => {
    const mesh = new THREE.Mesh(new THREE.BoxGeometry(piece.w, h, piece.l), new THREE.MeshStandardMaterial({ color: "#c7b77a", roughness: 0.8, polygonOffset: true, polygonOffsetFactor: 1, polygonOffsetUnits: 1 }));
    mesh.position.set(piece.x, block.yBase + block.h + h / 2, piece.z);
    currentGroup.add(mesh);
  });
}

function createGableGeometry(width, length, height) {
  const w = width / 2;
  const l = length / 2;
  const vertices = new Float32Array([
    -w, 0, -l, w, 0, -l, 0, height, -l,
    -w, 0, l, 0, height, l, w, 0, l,
    -w, 0, -l, -w, 0, l, 0, height, l,
    -w, 0, -l, 0, height, l, 0, height, -l,
    w, 0, -l, 0, height, -l, 0, height, l,
    w, 0, -l, 0, height, l, w, 0, l,
    -w, 0, -l, -w, 0, l, w, 0, l,
    -w, 0, -l, w, 0, l, w, 0, -l,
  ]);
  const geometry = new THREE.BufferGeometry();
  geometry.setAttribute("position", new THREE.BufferAttribute(vertices, 3));
  geometry.computeVertexNormals();
  return geometry;
}

function animate() {
  animationId = requestAnimationFrame(animate);
  controls.update();
  renderer.render(scene, camera);
}

function getInput() {
  const data = new FormData(form);
  return {
    type: data.get("type"),
    buildingArea: Number(data.get("buildingArea")),
    siteArea: Number(data.get("siteArea")),
    siteRatio: Number(data.get("siteRatio")),
    siteMode: data.get("siteMode"),
    sitePoints: [...state.sitePoints],
    floorMode: data.get("floorMode"),
    manualFloors: Number(data.get("manualFloors")) || 0,
    manualHeight: Number(data.get("manualHeight")) || 0,
    roofType: data.get("roofType"),
    seed: state.seed,
  };
}

function applyInput(input) {
  Object.assign(state, input);
  state.generated = generateSchemes(state, INITIAL_SCHEME_COUNT, 0);
  state.schemeCursor = state.generated.length;
  state.optionIndex = 0;
  renderAll();
}

function appendMoreSchemes() {
  Object.assign(state, getInput());
  const more = generateSchemes(state, MORE_SCHEME_COUNT, state.schemeCursor);
  state.generated.push(...more);
  state.schemeCursor += more.length;
  renderAll();
  const active = optionList.querySelector(".option.active");
  active?.scrollIntoView({ block: "nearest" });
}

function renderAll() {
  const selected = state.generated[state.optionIndex];
  if (!selected) return;
  renderMetrics(selected);
  renderOptions();
  drawScheme(selected);
  schemeTitle.textContent = selected.name;
  schemeSubtitle.textContent = `${BUILDING_RULES[selected.type].label} / ${formName(selected.form)} / ${selected.floors}F / ${formatNumber(selected.height)}m`;
  infoStrip.innerHTML = `
    <span>建筑面积 <b>${formatNumber(selected.buildingArea)}</b> m²</span>
    <span>占地 <b>${formatNumber(selected.footprint)}</b> m²</span>
    <span>建筑高度 <b>${formatNumber(selected.height)}</b> m</span>
    <span>${selected.notes[0]}</span>
  `;
}

function renderMetrics(scheme) {
  metricsEl.innerHTML = `
    <article>
      <span>容积率</span>
      <strong>${formatNumber(scheme.far)}</strong>
    </article>
    <article>
      <span>覆盖率</span>
      <strong>${formatNumber(scheme.coverage * 100)}%</strong>
    </article>
    <article>
      <span>层数 / 高度</span>
      <strong>${scheme.floors}F / ${formatNumber(scheme.height)}m / ${(scheme.height / 10).toFixed(1)}格</strong>
    </article>
    <article>
      <span>基地包络</span>
      <strong>${formatNumber(scheme.siteLength)} × ${formatNumber(scheme.siteWidth)}</strong>
    </article>
  `;
}

function renderOptions() {
  optionList.innerHTML = "";
  state.generated.forEach((scheme, index) => {
    const button = document.createElement("button");
    button.type = "button";
    button.className = `option ${index === state.optionIndex ? "active" : ""}`;
    button.innerHTML = `
      <span>
        <strong>${scheme.name}</strong>
        <em>${formName(scheme.form)} · ${scheme.blocks.length} 个体量 · ${scheme.detailTags.join(" / ")}</em>
      </span>
      <b>${scheme.floors}F</b>
    `;
    button.addEventListener("click", () => {
      state.optionIndex = index;
      renderAll();
    });
    optionList.appendChild(button);
  });
  const counter = document.createElement("div");
  counter.className = "optionCounter";
  counter.textContent = `已生成 ${state.generated.length} 个方案，可继续追加`;
  optionList.appendChild(counter);
}

function formName(form) {
  const names = {
    slab: "板式",
    bar: "条形",
    tower: "塔楼基座",
    podium: "连续退台",
    atrium: "中庭错落",
    courtyard: "院落围合",
    cluster: "错落组团",
    podiumTower: "裙房塔楼",
    interlock: "穿插体量",
    cantilever: "悬挑体量",
    stepped: "退台堆叠",
    bridge: "双塔连桥",
    lShape: "L形转角",
    uShape: "U形围合",
    twinTower: "双塔并置",
    pointBlock: "点式独栋",
    cascade: "跌落退台",
    ziggurat: "阶梯收分",
    hybrid: "混合叠合",
    perimeterBlock: "周边街区",
    freeMix: "自由混合",
    multiInterlock: "多重穿插",
    porousMat: "多孔基底",
    cantileverChain: "连续悬挑",
    pinwheel: "风车穿插",
    terraceVillage: "台地聚落",
    rotatedCluster: "旋转簇群",
    slicedStack: "切片堆叠",
    foldedPlate: "折板造型",
    splitTower: "双塔基座",
  };
  return names[form] || form;
}


function exportSTL() {
  const scheme = state.generated[state.optionIndex];
  if (!scheme) return;
  const NL = "\n";
  const SEGS = 12;
  let stl = "solid massing_" + scheme.name.replace(/ /g, "_") + NL;

  // Helper to add a triangle to STL
  function addTri(ax, ay, az, bx, by, bz, cx, cy, cz) {
    const ux=bx-ax, uy=by-ay, uz=bz-az;
    const wx=cx-ax, wy=cy-ay, wz=cz-az;
    const nx=uy*wz-uz*wy, ny=uz*wx-ux*wz, nz=ux*wy-uy*wx;
    const len=Math.sqrt(nx*nx+ny*ny+nz*nz)||1;
    stl += "  facet normal " + (nx/len).toFixed(6) + " " + (nz/len).toFixed(6) + " " + (ny/len).toFixed(6) + NL;
    stl += "    outer loop" + NL;
    stl += "      vertex " + ax.toFixed(4) + " " + az.toFixed(4) + " " + ay.toFixed(4) + NL;
    stl += "      vertex " + bx.toFixed(4) + " " + bz.toFixed(4) + " " + by.toFixed(4) + NL;
    stl += "      vertex " + cx.toFixed(4) + " " + cz.toFixed(4) + " " + cy.toFixed(4) + NL;
    stl += "    endloop" + NL;
    stl += "  endfacet" + NL;
  }

  scheme.blocks.forEach((block) => {
    const hw = block.w / 2, hl = block.l / 2;
    const y0 = block.yBase, y1 = block.yBase + block.h;
    const x0 = block.x - hw, x1 = block.x + hw;
    const z0 = block.z - hl, z1 = block.z + hl;
    const v = [
      [x0,y0,z0],[x1,y0,z0],[x1,y1,z0],[x0,y1,z0],
      [x0,y0,z1],[x1,y0,z1],[x1,y1,z1],[x0,y1,z1],
    ];
    const tris = [
      [0,1,2],[0,2,3],[1,5,6],[1,6,2],
      [5,4,7],[5,7,6],[4,0,3],[4,3,7],
      [3,2,6],[3,6,7],[4,5,1],[4,1,0],
    ];
    tris.forEach(t => {
      const a=v[t[0]],b=v[t[1]],c=v[t[2]];
      addTri(a[0],a[1],a[2],b[0],b[1],b[2],c[0],c[1],c[2]);
    });

    // Add columns for this block
    const cols = getBlockColumns(block, scheme);
    cols.forEach(col => {
      const r = col.radius;
      const h = col.columnHeight;
      const cx2 = col.x, cz2 = col.z;
      const botY = 0, topY = h;
      // Generate circle points
      const pts = [];
      for (let i = 0; i < SEGS; i++) {
        const a = (Math.PI * 2 * i) / SEGS;
        pts.push([cx2 + Math.cos(a) * r, cz2 + Math.sin(a) * r]);
      }
      // Side triangles
      for (let i = 0; i < SEGS; i++) {
        const j = (i + 1) % SEGS;
        addTri(pts[i][0], botY, pts[i][1], pts[j][0], botY, pts[j][1], pts[j][0], topY, pts[j][1]);
        addTri(pts[i][0], botY, pts[i][1], pts[j][0], topY, pts[j][1], pts[i][0], topY, pts[i][1]);
      }
      // Top and bottom fans
      for (let i = 1; i < SEGS - 1; i++) {
        addTri(pts[0][0], botY, pts[0][1], pts[i][0], botY, pts[i][1], pts[i+1][0], botY, pts[i+1][1]);
        addTri(pts[0][0], topY, pts[0][1], pts[i+1][0], topY, pts[i+1][1], pts[i][0], topY, pts[i][1]);
      }
    });
  });
  stl += "endsolid massing_" + scheme.name.replace(/ /g, "_") + NL;
  const blob = new Blob([stl], { type: "model/stl" });
  const url = URL.createObjectURL(blob);
  const link = document.createElement("a");
  link.href = url;
  link.download = "massing-" + scheme.name.replace(/ /g, "-") + ".stl";
  link.click();
  URL.revokeObjectURL(url);
}




function renderSketch() {
  const pointText = state.sitePoints.map((point) => `${point.x},${point.y}`).join(" ");
  siteSketch.innerHTML = `
    <rect x="1" y="1" width="358" height="218" rx="8"></rect>
    <polyline points="${pointText}" class="sketchLine"></polyline>
    ${state.sitePoints.map((point, index) => `<circle data-index="${index}" cx="${point.x}" cy="${point.y}" r="${index === state.selectedSitePoint ? 7 : 5}" class="${index === state.selectedSitePoint ? "selected" : ""}"></circle><text x="${point.x + 8}" y="${point.y - 8}">${index + 1}</text>`).join("")}
  `;
}

function sketchPointFromEvent(event) {
  const rect = siteSketch.getBoundingClientRect();
  return {
    x: clamp(((event.clientX - rect.left) / rect.width) * 360, 8, 352),
    y: clamp(((event.clientY - rect.top) / rect.height) * 220, 8, 212),
  };
}

function refreshFromSketchEdit() {
  renderSketch();
  if (new FormData(form).get("siteMode") === "free" && state.sitePoints.length >= 3) {
    applyInput(getInput());
  }
}

function updateSiteMode() {
  const mode = new FormData(form).get("siteMode");
  siteEditor.hidden = mode !== "free";
  ratioControl.hidden = mode === "free";
}

form.addEventListener("submit", (event) => {
  event.preventDefault();
  applyInput(getInput());
});

form.siteRatio.addEventListener("input", () => {
  ratioOut.value = Number(form.siteRatio.value).toFixed(2);
});

form.querySelectorAll('input[name="siteMode"]').forEach((radio) => {
  radio.addEventListener("change", () => {
    updateSiteMode();
    applyInput(getInput());
  });
});

siteSketch.addEventListener("pointerdown", (event) => {
  const target = event.target.closest?.("circle[data-index]");
  if (target) {
    state.selectedSitePoint = Number(target.dataset.index);
  } else {
    state.sitePoints.push(sketchPointFromEvent(event));
    state.selectedSitePoint = state.sitePoints.length - 1;
  }
  state.draggingSitePoint = true;
  siteSketch.setPointerCapture?.(event.pointerId);
  refreshFromSketchEdit();
});

siteSketch.addEventListener("pointermove", (event) => {
  if (!state.draggingSitePoint || state.selectedSitePoint < 0) return;
  state.sitePoints[state.selectedSitePoint] = sketchPointFromEvent(event);
  refreshFromSketchEdit();
});

siteSketch.addEventListener("pointerup", (event) => {
  state.draggingSitePoint = false;
  siteSketch.releasePointerCapture?.(event.pointerId);
  refreshFromSketchEdit();
});

window.addEventListener("keydown", (event) => {
  if (!["Delete", "Backspace"].includes(event.key)) return;
  if (state.selectedSitePoint < 0 || state.sitePoints.length <= 3) return;
  const active = document.activeElement;
  if (active && ["INPUT", "SELECT", "TEXTAREA"].includes(active.tagName)) return;
  state.sitePoints.splice(state.selectedSitePoint, 1);
  state.selectedSitePoint = Math.min(state.selectedSitePoint, state.sitePoints.length - 1);
  refreshFromSketchEdit();
});

document.querySelector("#resetSiteButton").addEventListener("click", () => {
  state.sitePoints = [];
  state.selectedSitePoint = -1;
  renderSketch();
  applyInput(getInput());
});

document.querySelector("#shuffleButton").addEventListener("click", () => {
  state.seed += 13;
  applyInput(getInput());
});

document.querySelector("#loadMoreButton").addEventListener("click", () => {
  state.seed += 29;
  appendMoreSchemes();
});


  document.querySelector("#exportStlButton").addEventListener("click", exportSTL);

renderSketch();
updateSiteMode();
setupScene();
applyInput(getInput());

window.addEventListener("beforeunload", () => {
  cancelAnimationFrame(animationId);
  resizeObserver?.disconnect();
});

  </script>
